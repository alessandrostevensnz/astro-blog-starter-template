name: Temporary live Contact CMS verification
on:
  pull_request:
    paths:
      - ".github/workflows/contact-live-smoke.yml"
      - "tests/contact-live-smoke.mjs"
permissions:
  contents: read
jobs:
  test-live-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production Contact text controls and form without submission
        run: node tests/contact-live-smoke.mjs
