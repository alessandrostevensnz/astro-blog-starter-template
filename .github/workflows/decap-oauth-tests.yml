name: ANDRO OAuth regression tests

on:
  pull_request:
    paths:
      - "src/lib/decap-oauth.ts"
      - "src/pages/api/auth/**"
      - "public/admin/oauth-popup.js"
      - "public/admin/index.html"
      - "tests/decap-oauth.test.mjs"
      - ".github/workflows/decap-oauth-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/decap-oauth.ts"
      - "src/pages/api/auth/**"
      - "public/admin/oauth-popup.js"
      - "public/admin/index.html"
      - "tests/decap-oauth.test.mjs"

permissions:
  contents: read

jobs:
  test-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check popup helper
        run: node --check public/admin/oauth-popup.js
      - name: Test Decap OAuth state, popup and receipt handoff
        run: node --experimental-strip-types --test tests/decap-oauth.test.mjs
