name: Render ANDRO 1080p header videos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-hero-videos.yml"
      - "scripts/render-hero-videos.py"
      - "public/images/Residential framing.png"
      - "public/images/preston.png"
      - "public/images/Bright Wainscoted Hallway with Open Door.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render 8-second video headers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out ANDRO website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image rendering libraries
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5"
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Render full HD video loops from original page photos
        run: python scripts/render-hero-videos.py

      - name: Validate dimensions, duration and frames
        run: |
          for kind in about construction maintenance; do
            file="public/images/andro-${kind}-1080p-8s.mp4"
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -show_entries format=duration -of default=noprint_wrappers=1 "$file"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")" = "1920"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")" = "1080"
          done

      - name: Commit produced MP4 files for Cloudflare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/images/andro-about-1080p-8s.mp4 public/images/andro-construction-1080p-8s.mp4 public/images/andro-maintenance-1080p-8s.mp4
          if git diff --cached --quiet; then
            echo "No new video bytes"
            exit 0
          fi
          git commit -m "Generate 8-second Full HD hero videos from original ANDRO photos"
          git push origin HEAD:main
