name: ANDRO giveaway checks
on:
  pull_request:
    paths:
      - "src/lib/win.ts"
      - "src/lib/win-meta.ts"
      - "src/lib/win-meta-sheets.ts"
      - "scripts/ANDRO_Facebook_Lead_Sync.gs"
      - "tests/win-meta-sheets.test.mjs"
      - "docs/win-google-sheets-sync.md"
      - "migrations/0003_win_meta_leads.sql"
      - "tests/win-meta.test.mjs"
      - "docs/win-facebook-instant-form.md"
      - "src/pages/win.astro"
      - "src/lib/cms-config.ts"
      - "content/pages/win.json"
      - "tests/win-editor.test.mjs"
      - "public/admin/index.html"
      - "public/admin/preview.js"
      - "src/pages/win/**"
      - "src/pages/api/win/**"
      - "src/middleware.ts"
      - "wrangler.json"
      - "migrations/0001_win_entries.sql"
      - "migrations/0002_win_draw_audit.sql"
      - "docs/win-giveaway-setup.md"
      - "tests/win-entry.test.mjs"
      - ".github/workflows/win-giveaway-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/win.ts"
      - "src/lib/win-meta.ts"
      - "src/lib/win-meta-sheets.ts"
      - "scripts/ANDRO_Facebook_Lead_Sync.gs"
      - "tests/win-meta-sheets.test.mjs"
      - "docs/win-google-sheets-sync.md"
      - "migrations/0003_win_meta_leads.sql"
      - "tests/win-meta.test.mjs"
      - "docs/win-facebook-instant-form.md"
      - "src/pages/win.astro"
      - "src/lib/cms-config.ts"
      - "content/pages/win.json"
      - "tests/win-editor.test.mjs"
      - "public/admin/index.html"
      - "public/admin/preview.js"
      - "src/pages/win/**"
      - "src/pages/api/win/**"
      - "src/middleware.ts"
      - "wrangler.json"
      - "migrations/0001_win_entries.sql"
      - "migrations/0002_win_draw_audit.sql"
      - "docs/win-giveaway-setup.md"
      - "tests/win-entry.test.mjs"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test giveaway validation and security controls
        run: node --experimental-strip-types --test tests/win-entry.test.mjs tests/win-editor.test.mjs tests/win-meta.test.mjs tests/win-meta-sheets.test.mjs
      - name: Build Astro application
        run: npm run build
      - name: Check TypeScript types
        run: npx tsc --noEmit
