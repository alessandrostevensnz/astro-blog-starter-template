<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ANDRO site editor</title>
    <meta name="andro-login-version" content="5" />
    <style>
      /* ANDRO editor appearance; no changes to CMS data or form behaviour. */
      :root { --andro-ink:#252723; --andro-gold:#a88b5b; --andro-paper:#f8f7f4; }
      body { background:var(--andro-paper); font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      input, textarea, select { border-radius:7px !important; border-color:#dcdedb !important; font-family:inherit !important; }
      input:focus, textarea:focus, select:focus { outline-color:var(--andro-gold) !important; border-color:var(--andro-gold) !important; }
      button { font-family:inherit !important; }
      [class*="ControlPane"], [class*="EditorControlPane"] { background:var(--andro-paper) !important; }
      [class*="ObjectControl"] { border-radius:9px !important; }
      [class*="FieldLabel"], [class*="fieldLabel"] { letter-spacing:.02em !important; font-weight:600 !important; }
      [class*="FieldHint"], [class*="fieldHint"] { color:#777b75 !important; font-size:12px !important; line-height:1.5 !important; }
      [class*="ObjectControl"] [class*="TopBar"], [class*="ObjectControl"] [class*="Header"] { border-radius:8px !important; }
      [class*="Editor"] button:focus-visible, #andro-real-preview button:focus-visible { outline:2px solid var(--andro-gold); outline-offset:2px; }

      /* Do not hide Decap preview containers: in this CMS version those
         selectors can also match an ancestor of the editing form.
         The real Astro iframe already covers the native right-hand preview. */
      /* Softer, more approachable editing surfaces. */
      [class*="ObjectControl"] { border: 1px solid #e8e7e2 !important; background: #fff !important; box-shadow: 0 2px 9px rgba(20,24,20,.025) !important; }
      [class*="ObjectControl"] [class*="TopBar"], [class*="ObjectControl"] [class*="Header"] { background: #f2f1ed !important; }
      [class*="FieldLabel"], [class*="fieldLabel"] { text-transform: none !important; }
      input, textarea, select { background: #fff !important; }
      #andro-real-preview { position: fixed; z-index: 20; top: 66px; right: 0; bottom: 0; width: 50%; background: #fbfaf7; border-left: 1px solid #e0dfda; box-shadow:-8px 0 24px rgba(24,28,23,.045); display: flex; flex-direction: column; }
      #andro-real-preview[hidden] { display: none; }
      #andro-real-preview .andro-preview-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 18px; background: #252723; color: #fff; font: 11px Inter,Arial,sans-serif; letter-spacing:.045em; }
      #andro-real-preview .andro-preview-bar span { color: #d8c9ae; }
      #andro-real-preview iframe { display: block; flex: 1; width: 100%; border: 0; background: #fff; }
      @media (max-width: 1000px) { #andro-real-preview { width: 45%; } }
      @media (max-width: 700px) { #andro-real-preview { width: 48%; } #andro-real-preview .andro-preview-bar span { display: none; } }
    </style>
  </head>
  <body>
    <!-- Install before Decap opens its named GitHub authentication popup. -->
    <script src="/admin/oauth-popup.js?v=5"></script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.8.3/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
