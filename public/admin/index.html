<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ANDRO site editor</title>
    <style>
      #andro-real-preview { position: fixed; z-index: 20; top: 112px; right: 0; bottom: 0; width: 50%; background: #fbfaf7; border-left: 1px solid #d8d8d8; display: flex; flex-direction: column; }
      #andro-real-preview[hidden] { display: none; }
      #andro-real-preview .andro-preview-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 14px; background: #252723; color: #fff; font: 11px Arial,sans-serif; }
      #andro-real-preview .andro-preview-bar span { color: #d8c9ae; }
      #andro-real-preview iframe { display: block; flex: 1; width: 100%; border: 0; background: #fff; }
      @media (max-width: 700px) { #andro-real-preview { width: 48%; } #andro-real-preview .andro-preview-bar span { display: none; } }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.8.3/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
