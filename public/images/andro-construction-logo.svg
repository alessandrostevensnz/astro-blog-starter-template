<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">ANDRO Construction logo</title>
  <desc id="desc">Circular ANDRO Construction logo with the words “Changing the world one build at a time above and beyond construction” and “Est. 2020”.</desc>
  <defs>
    <path id="ring" d="M 320,320 m -220,0 a 220,220 0 1,1 440,0 a 220,220 0 1,1 -440,0" />
  </defs>
  <circle cx="320" cy="320" r="216" fill="none" stroke="#242424" stroke-width="2" />
  <circle cx="320" cy="320" r="222" fill="none" stroke="#242424" stroke-width="1.5" />
  <text fill="#292929" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1.6">
    <textPath href="#ring" startOffset="0%">EST. 2020 · CHANGING THE WORLD ONE BUILD AT A TIME ABOVE AND BEYOND CONSTRUCTION · </textPath>
  </text>
  <text x="320" y="318" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="300" letter-spacing="5" text-anchor="middle">ANDRO</text>
  <text x="320" y="365" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="300" text-anchor="middle">construction</text>
</svg>
